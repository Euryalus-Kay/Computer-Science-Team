name: Desktop app

# Builds the Lab CS app for Mac and Windows and publishes it as a GitHub release, which
# the website's download buttons and install commands use. A push to the default branch
# publishes when desktop/package.json has a version with no release yet, so a release is
# just a version bump. Running it from the Actions tab or pushing a desktop-v tag
# publishes again.
on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]
    branches: ["**"]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux AppImage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Bake in the app secret
        env:
          SECRET: ${{ secrets.DESKTOP_APP_SECRET }}
        run: |
          if [ -n "$SECRET" ]; then node -e 'require("fs").writeFileSync("lib/secret.json", JSON.stringify({ secret: process.env.SECRET }))'; fi
      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ runner.os }}
          path: |
            desktop/dist/LabCS-*.dmg
            desktop/dist/LabCS-*.zip
            desktop/dist/LabCS-*.exe
            desktop/dist/LabCS-*.AppImage
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/desktop-v') || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./desktop/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ] && gh release view "desktop-v$version" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "desktop-v$version is already released"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.v.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - if: steps.v.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Lab CS app ${{ steps.v.outputs.version }}
          body: Lockdown app for Lab CS tests. Install it from the website's Desktop app page.
          make_latest: true
          files: out/*
